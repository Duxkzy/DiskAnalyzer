name: Build desktop applications
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
            artifact: linux-x64
          - os: windows-latest
            script: build:windows
            artifact: windows-x64
          - os: macos-latest
            script: build:mac
            artifact: macos-intel-and-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: disk-analyzer-${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.zip
          if-no-files-found: error
